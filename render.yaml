# Render Blueprint: one web service plus one PostgreSQL database.
databases:
  - name: promis-db
    plan: basic-256mb
    databaseName: promis
    user: promis

services:
  - type: web
    name: sdlg-promis
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: promis-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
