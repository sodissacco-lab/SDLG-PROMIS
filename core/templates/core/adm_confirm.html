{% extends "core/adm_base.html" %}
{% block adm %}
<div class="panel">
  <h2>{{ title }}</h2>
  <p>Delete <b>{{ obj }}</b>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="adm-btn red" type="submit">Yes, delete</button>
    <a class="adm-btn alt" href="{{ back_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
