{% extends "core/shell.html" %}
{% block content %}
<style>
  .pc{max-width:420px;background:#fff;border:1px solid #dde5dd;border-radius:12px;padding:18px}
  .pc label{font-size:13px;font-weight:600;color:#445544}
  .pc input{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 12px;border:1px solid #bcc9bc;border-radius:8px;font-size:15px}
  .pc .errorlist{color:#b00020;font-size:13px;margin:0 0 6px;padding-left:18px}
  .pc ul{font-size:12px;color:#5a6b5a}
  .pc button{background:#1f5c3a;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
</style>
<h2 style="margin-top:0">Change password</h2>
<div class="pc">
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save new password</button></form>
</div>
<p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>
{% endblock %}
