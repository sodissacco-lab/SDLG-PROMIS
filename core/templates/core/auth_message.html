{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} | SDLG PRODUCTION MIS</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b2b1b}
.box{width:100%;max-width:400px;margin:16px;background:#fff;border:1px solid #dde5dd;border-radius:16px;padding:26px;box-shadow:0 6px 24px rgba(20,60,35,.08);text-align:center}
.logo{height:64px;margin:0 auto 10px}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;color:#445544;line-height:1.5}
.btn{display:inline-block;background:#1f5c3a;color:#fff;border-radius:9px;padding:11px 18px;text-decoration:none;font-weight:600;margin-top:6px}
a{color:#1f5c3a}
</style></head><body>
<div class="box"><img class="logo" src="{% static 'core/letterhead_arms.png' %}" alt="">
  <h1>{{ title }}</h1><p>{{ message }}</p>
  {% if show_login %}<a class="btn" href="{% url 'login' %}">Sign in</a>{% else %}<p><a href="{% url 'login' %}">Back to sign in</a></p>{% endif %}
</div></body></html>
